[workspace]
members = ["main", "xtask"]
default-members = ["main"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "signal"] }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
